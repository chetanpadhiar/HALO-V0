<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HALO 2.0 — Contextual Email Trust &amp; Forensic Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#e8001d;
    --accent-dim:#8f0012;
    --bg-void:#040a12;
    --bg-frame:#091326;
    --panel:#f5f3ee;
    --rule:#d0ccc4;
    --cyan:#00f0ff;
    --cyan-bright:#00d2be;
    --ink:#151312;
    --ink-soft:#4b4740;
    --safe:#1f8f4e;
    --warn:#c47a00;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-void);
    color:var(--ink);
    font-family:'VT323',monospace;
    min-height:100vh;
    padding:18px;
  }
  .hdr{font-family:'Press Start 2P',monospace;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-frame);}
  ::-webkit-scrollbar-thumb{background:var(--accent);border:2px solid var(--bg-void);}
  button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--cyan);outline-offset:1px;}

  .chassis{
    background:var(--bg-frame);
    border:5px solid var(--rule);
    box-shadow: 0 0 0 3px var(--bg-void), 0 0 40px rgba(232,0,29,0.15);
    padding:14px;
    max-width:1500px;
    margin:0 auto;
  }

  /* ---------- TICKER ---------- */
  .ticker-bar{background:var(--bg-void);border:3px solid var(--cyan);overflow:hidden;white-space:nowrap;padding:6px 0;margin-bottom:10px;position:relative;}
  .ticker-track{display:inline-block;padding-left:100%;animation:ticker-scroll 32s linear infinite;color:var(--cyan);font-size:18px;letter-spacing:1px;}
  .ticker-track span{margin-right:60px;}
  .ticker-track span.hot{color:var(--accent);}
  @keyframes ticker-scroll{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}

  /* ---------- NAV SHELL ---------- */
  .nav-shell{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:10px 4px 16px;}
  .badge{background:linear-gradient(180deg,#151d33,#0d1526);border:4px solid var(--accent);box-shadow:0 0 0 2px var(--bg-void), inset 0 0 0 2px rgba(0,210,190,0.35);padding:9px 20px;color:var(--cyan);font-family:'Press Start 2P',monospace;font-size:17px;letter-spacing:2px;position:relative;cursor:pointer;}
  .badge::before,.badge::after{content:'';position:absolute;width:8px;height:8px;background:var(--accent);top:-4px;}
  .badge::before{left:-4px;}
  .badge::after{right:-4px;}
  .badge .sub{font-family:'VT323',monospace;color:var(--rule);font-size:13px;letter-spacing:2px;margin-top:5px;text-align:center;}
  .nav-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .status-pill{font-family:'VT323',monospace;font-size:15px;color:#9df7c4;border:2px solid var(--safe);padding:5px 10px;background:rgba(31,143,78,0.12);display:flex;align-items:center;gap:7px;}
  .status-pill .dot{width:8px;height:8px;background:var(--safe);box-shadow:0 0 6px var(--safe);animation:blink 1.4s steps(2) infinite;}
  @keyframes blink{50%{opacity:0.25;}}
  .mode-switch{display:flex;border:2px solid var(--ink);}
  .mode-btn{font-family:'Press Start 2P',monospace;font-size:10.5px;letter-spacing:1px;padding:9px 12px;background:var(--rule);color:var(--ink-soft);border:none;cursor:pointer;}
  .mode-btn.active{background:var(--accent);color:#fff;}
  .reset-btn{font-family:'VT323',monospace;font-size:15px;color:var(--rule);background:transparent;border:2px solid var(--rule);padding:6px 10px;cursor:pointer;}
  .reset-btn:hover{border-color:var(--cyan);color:var(--cyan);}

  .subnav{display:flex;gap:0;border:2px solid var(--ink);margin-bottom:14px;flex-wrap:wrap;}
  .subnav button{font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:1px;padding:11px 14px;background:var(--panel);color:var(--ink-soft);border:none;border-right:2px solid var(--ink);cursor:pointer;}
  .subnav button:last-child{border-right:none;}
  .subnav button.active{background:var(--ink);color:var(--cyan);}

  /* ---------- PANEL / GENERIC ---------- */
  .panel{background:var(--panel);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--bg-void);padding:16px;margin-bottom:16px;}
  .panel-title{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--accent);border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:14px;letter-spacing:1px;}
  label.field-label{display:block;font-family:'VT323',monospace;font-size:16px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:6px;}
  .pixel-input,.pixel-select{width:100%;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--rule);padding:10px 8px;font-family:'VT323',monospace;font-size:18px;color:var(--ink);margin-bottom:14px;outline:none;}
  .pixel-btn{font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:1px;color:#fff;background:var(--accent);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px 18px;cursor:pointer;transition:transform .04s linear;}
  .pixel-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  .pixel-btn:disabled{background:#9a9a9a;cursor:wait;}
  .pixel-btn.secondary{background:var(--bg-frame);color:var(--cyan);font-size:11px;box-shadow:3px 3px 0 var(--ink);}
  .pixel-btn.secondary:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink);}
  .pixel-btn.safe{background:var(--safe);}
  .pixel-btn.ghost{background:var(--panel);color:var(--ink);}
  .pixel-btn.block{width:100%;text-align:center;}

  .terminal{background:#06141b;border:3px solid var(--cyan);color:#7effc4;font-family:'VT323',monospace;font-size:16px;line-height:1.55;padding:12px;overflow-y:auto;white-space:pre-wrap;}
  .terminal .err{color:var(--accent);}
  .terminal .warn{color:#ffd24d;}
  .terminal .ok{color:#7effc4;}
  .cursor-blink{animation:blink 1s steps(2) infinite;}

  .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .metric-card{background:#fff;border:2px solid var(--ink);padding:10px 12px;box-shadow:3px 3px 0 var(--rule);}
  .metric-card .m-label{font-size:14px;letter-spacing:1px;color:var(--ink-soft);}
  .metric-card .m-value{font-size:20px;color:var(--ink);}
  .flag-ok{color:var(--safe);}
  .flag-bad{color:var(--accent);}
  .flag-warn{color:var(--warn);}

  .header-block{background:#06141b;color:#c9d3e0;font-family:'VT323',monospace;font-size:16px;padding:12px;line-height:1.6;border:2px solid var(--ink);white-space:pre-wrap;}
  .hl-fail{color:var(--accent);font-weight:bold;}
  .hl-pass{color:#7effc4;}

  .tab-row{display:flex;border-bottom:3px solid var(--ink);flex-wrap:wrap;}
  .tab-btn{font-family:'Press Start 2P',monospace;font-size:10.5px;letter-spacing:1px;padding:12px 14px;background:var(--rule);color:var(--ink-soft);border:none;border-right:3px solid var(--ink);cursor:pointer;}
  .tab-btn.active{background:var(--panel);color:var(--accent);}
  .tab-content{padding:16px 4px;display:none;}
  .tab-content.active{display:block;}

  .footnote{text-align:center;color:var(--rule);font-size:14px;margin-top:12px;letter-spacing:1px;}

  /* ---------- LANDING / CONNECT ---------- */
  .connect-wrap{max-width:560px;margin:30px auto;text-align:center;}
  .connect-wrap h1{font-family:'Press Start 2P',monospace;font-size:20px;color:var(--panel);letter-spacing:1px;margin-bottom:10px;}
  .connect-wrap p{color:var(--rule);font-size:18px;margin-bottom:26px;}
  .connect-card{background:var(--panel);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--bg-void);padding:26px 22px;}
  .connect-card h2{font-family:'Press Start 2P',monospace;font-size:14px;margin:0 0 18px;color:var(--ink);}
  .provider-btn{width:100%;display:block;margin-bottom:12px;font-family:'VT323',monospace;font-size:19px;letter-spacing:1px;padding:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--ink);text-align:center;}
  .provider-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  .connect-note{color:var(--ink-soft);font-size:14px;margin-top:14px;}

  /* ---------- SCANNING ---------- */
  .scan-wrap{max-width:640px;margin:26px auto;}
  .scan-counter{font-family:'Press Start 2P',monospace;font-size:40px;color:var(--cyan);text-align:center;margin:8px 0 4px;}
  .scan-counter-label{text-align:center;color:var(--rule);font-size:16px;letter-spacing:2px;margin-bottom:20px;}
  .stage-list{list-style:none;margin:0;padding:0;}
  .stage-list li{font-size:18px;color:var(--ink-soft);padding:8px 4px;opacity:0.35;display:flex;gap:10px;align-items:center;}
  .stage-list li.done{opacity:1;color:var(--ink);}
  .stage-list li .mark{width:18px;display:inline-block;color:var(--safe);font-family:'Press Start 2P',monospace;font-size:12px;}

  /* ---------- SUMMARY ---------- */
  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:760px){.summary-grid{grid-template-columns:1fr;}}
  .summary-card{border:4px solid var(--ink);padding:20px;cursor:pointer;box-shadow:5px 5px 0 var(--bg-void);text-align:center;background:#fff;}
  .summary-card .sc-num{font-family:'Press Start 2P',monospace;font-size:30px;}
  .summary-card .sc-label{font-size:17px;color:var(--ink-soft);margin-top:8px;letter-spacing:1px;}
  .summary-card.high{border-color:var(--accent);} .summary-card.high .sc-num{color:var(--accent);}
  .summary-card.attn{border-color:var(--warn);} .summary-card.attn .sc-num{color:var(--warn);}
  .summary-card.safe{border-color:var(--safe);} .summary-card.safe .sc-num{color:var(--safe);}

  /* ---------- INBOX ---------- */
  .inbox-row{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);border-left-width:8px;background:#fff;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:3px 3px 0 var(--rule);}
  .inbox-row:hover{box-shadow:5px 5px 0 var(--rule);}
  .inbox-row.high{border-left-color:var(--accent);}
  .inbox-row.attention{border-left-color:var(--warn);}
  .inbox-row.safe{border-left-color:var(--safe);}
  .inbox-row .ir-main{flex:1;min-width:0;}
  .inbox-row .ir-subject{font-size:18px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .inbox-row .ir-sender{font-size:14px;color:var(--ink-soft);}
  .inbox-row .ir-date{font-size:13px;color:var(--ink-soft);white-space:nowrap;}
  .badge-pill{font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:0.5px;padding:5px 7px;color:#fff;white-space:nowrap;}
  .badge-pill.high{background:var(--accent);}
  .badge-pill.attention{background:var(--warn);}
  .badge-pill.safe{background:var(--safe);}
  #inboxList{max-height:560px;overflow-y:auto;padding-right:4px;}

  /* ---------- EMAIL DETAIL ---------- */
  .verdict-block{border:4px solid var(--ink);padding:18px;margin-bottom:16px;box-shadow:5px 5px 0 var(--bg-void);}
  .verdict-block.high{background:#fdeceb;}
  .verdict-block.attention{background:#fff6e6;}
  .verdict-block.safe{background:#eaf7ef;}
  .verdict-headline{font-size:22px;color:var(--ink);margin:2px 0 10px;}
  .verdict-badges{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .vbadge{font-family:'Press Start 2P',monospace;font-size:10px;padding:8px 10px;border:2px solid var(--ink);background:#fff;}
  .why-list{list-style:none;margin:10px 0;padding:0;}
  .why-list li{font-size:17px;padding:5px 0;}
  .action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}

  .trust-gauge-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .gauge-readout{font-family:'Press Start 2P',monospace;font-size:26px;}
  .gauge-cap{font-size:15px;color:var(--ink-soft);}

  .baseline-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){.baseline-grid{grid-template-columns:1fr;}}
  .baseline-card{background:#fff;border:2px solid var(--ink);padding:10px 12px;box-shadow:3px 3px 0 var(--rule);}
  .baseline-card .bl-label{font-size:14px;color:var(--ink-soft);}
  .baseline-card .bl-row{display:flex;justify-content:space-between;font-size:17px;margin-top:4px;}

  /* ---------- GRAPH ---------- */
  .graph-shell{border:3px solid var(--ink);background:var(--bg-void);position:relative;padding:6px;}
  #corrGraph{width:100%;height:auto;display:block;}
  .graph-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--ink-soft);}
  .graph-legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend-dot{width:10px;height:10px;display:inline-block;}

  /* ---------- CAMPAIGNS ---------- */
  .campaign-row{border:3px solid var(--ink);background:#fff;padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:4px 4px 0 var(--rule);}
  .campaign-row h3{margin:0 0 6px;font-size:19px;color:var(--accent);}
  .campaign-row .cr-stats{font-size:15px;color:var(--ink-soft);}
  .timeline{list-style:none;margin:0;padding:0;}
  .timeline li{border-left:3px solid var(--accent);padding:4px 0 10px 14px;font-size:16px;margin-left:4px;}

  /* ---------- TOAST ---------- */
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#9df7c4;border:2px solid var(--safe);padding:12px 18px;font-size:16px;z-index:999;box-shadow:4px 4px 0 var(--bg-void);display:none;max-width:320px;}
  .toast.shown{display:block;}

  .screen{display:none;}
  .screen.active{display:block;}
</style>
</head>
<body>
<div class="chassis">

  <div class="ticker-bar"><div class="ticker-track" id="tickerTrack"></div></div>

  <div class="nav-shell">
    <div class="badge" id="brandBadge">HALO
      <div class="sub">contextual trust engine</div>
    </div>
    <div class="nav-right">
      <div class="status-pill"><span class="dot"></span><span id="statusText">DEMO MODE — SYNTHETIC DATA</span></div>
      <div class="mode-switch" id="navSwitch">
        <button class="mode-btn active" data-nav="student">STUDENT</button>
        <button class="mode-btn" data-nav="institution">INSTITUTION</button>
      </div>
      <button class="reset-btn" id="resetBtn">RESET DEMO</button>
    </div>
  </div>

  <div id="subnavStudent" class="subnav"></div>
  <div id="subnavInstitution" class="subnav" style="display:none;"></div>

  <main id="screenRoot"></main>

  <div class="footnote">HALO 2.0 — PROTOTYPE — synthetic demo data, scoring runs entirely in your browser.</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* HALO ENGINE */
const HaloEngine = (() => {
  const PROTECTED_BRANDS = ["paypal.com","google.com","microsoft.com","amazon.com","apple.com","linkedin.com"];
  const KNOWN_GOOD_DOMAINS = new Set(["amityonline.edu","github.com","spotify.com","coursera.org","tech-insider-daily.com","zomato.com","linkedin.com","google.com","microsoft.com","swiggy.com"]);
  const INFRA_TABLE = {
    "185.220.101.47": { asn:"AS208843", org:"Offshore Hosting Solutions Ltd.", country:"DE", region:"Frankfurt", tag:"bulk-anonymous-hosting", risk:85, confidence:"Low" },
    "191.101.203.19": { asn:"AS262954", org:"DataCenter Brasil Networks", country:"BR", region:"Sao Paulo", tag:"shared-vps", risk:65, confidence:"Medium" },
    "103.87.44.212": { asn:"AS142804", org:"QuickServe Cloud Hosting Pvt Ltd", country:"IN", region:"Mumbai", tag:"shared-vps", risk:68, confidence:"Medium" },
    "45.140.16.33": { asn:"AS210644", org:"AnonRelay Networks", country:"NL", region:"Amsterdam", tag:"bulk-anonymous-hosting", risk:80, confidence:"Low" },
    "76.223.54.10": { asn:"AS16509", org:"Cloud hosting - newly provisioned", country:"SG", region:"Singapore", tag:"unestablished-cloud", risk:68, confidence:"Low" },
    "142.250.80.46": { asn:"AS15169", org:"Google Cloud Platform (verified mail infra)", country:"US", region:"Mountain View", tag:"established-mail-provider", risk:3, confidence:"High" },
    "103.21.58.10": { asn:"AS45528", org:"Amity Online Education Campus Network", country:"IN", region:"Noida", tag:"institutional-network", risk:2, confidence:"High" },
    "13.107.6.156": { asn:"AS8075", org:"Microsoft Corporation (verified mail infra)", country:"US", region:"Redmond", tag:"established-mail-provider", risk:3, confidence:"High" }
  };
  const BASELINE = {
    "recruiter@talent-acquisition-portal.example": { seenBefore:true, historicalCredentialRequests:0, historicalPaymentRequests:0, typicalRequestTypes:["internship information","interview schedule","offer letter"] },
    "placements@amityonline.edu": { seenBefore:true, historicalCredentialRequests:0, historicalPaymentRequests:0, typicalRequestTypes:["interview schedule","document submission","offer letter"] },
    "it-helpdesk@amityonline.edu": { seenBefore:true, historicalCredentialRequests:0, historicalPaymentRequests:0, typicalRequestTypes:["password reset","device registration"] },
    "registrar@amityonline.edu": { seenBefore:true, historicalCredentialRequests:0, historicalPaymentRequests:0, typicalRequestTypes:["fee receipt","transcript request"] }
  };
  const URGENCY_WORDS = ["urgent","urgently","immediately","within 2 hours","within 24 hours","act now","asap","right away","final notice","last chance","expires today","hurry"];
  const CREDENTIAL_WORDS = ["password","otp","verification code","login credentials","college account credentials","confirm your account","security code","account credentials"];
  const PAYMENT_WORDS = ["verification fee","processing fee","registration fee","refundable fee","wire transfer","bank details","account number","pay ","payment of","gift card"];

  function domainOf(addr){ const m=/@([a-zA-Z0-9.-]+)/.exec(addr||""); return m?m[1].toLowerCase():null; }
  function unfoldHeaders(block){ const lines=block.split(/\r?\n/); const out=[]; for(const line of lines){ if(/^[ \t]/.test(line)&&out.length) out[out.length-1]+=" "+line.trim(); else if(line.trim()!=="") out.push(line); } return out; }
  function getHeader(lines,name){ const re=new RegExp("^"+name+":\\s*(.*)$","i"); return lines.filter(l=>re.test(l)).map(l=>re.exec(l)[1]); }
  function parseAuthResults(v){ if(!v) return {spf:"NOT PRESENT",dkim:"NOT PRESENT",dmarc:"NOT PRESENT",present:false}; const spf=/spf=(\w+)/i.exec(v),dkim=/dkim=(\w+)/i.exec(v),dmarc=/dmarc=(\w+)/i.exec(v); return {spf:spf?spf[1].toUpperCase():"NOT PRESENT",dkim:dkim?dkim[1].toUpperCase():"NOT PRESENT",dmarc:dmarc?dmarc[1].toUpperCase():"NOT PRESENT",present:true}; }
  function extractOriginIP(received){ if(!received.length) return null; const earliest=received[received.length-1]; const m=/\[?(\d{1,3}(?:\.\d{1,3}){3})\]?/.exec(earliest); return m?m[1]:null; }
  function parseEmailSource(raw){
    const idx=raw.search(/\r?\n\r?\n/);
    const headerBlock=idx===-1?raw:raw.slice(0,idx);
    const body=idx===-1?"":raw.slice(idx).trim();
    const headerLines=unfoldHeaders(headerBlock);
    const from=(getHeader(headerLines,"From")[0]||"").trim();
    const replyTo=(getHeader(headerLines,"Reply-To")[0]||"").trim();
    const subject=(getHeader(headerLines,"Subject")[0]||"").trim();
    const date=(getHeader(headerLines,"Date")[0]||"").trim();
    const authRaw=getHeader(headerLines,"Authentication-Results")[0]||"";
    const received=getHeader(headerLines,"Received");
    const senderMatch=from.match(/<?([\w.+-]+@[\w.-]+)>?/);
    return { raw, headerLines, body, from, replyTo, subject, date, senderAddr:senderMatch?senderMatch[1]:null,
      fromDomain:domainOf(from), replyToDomain:domainOf(replyTo), auth:parseAuthResults(authRaw), originIP:extractOriginIP(received) };
  }
  function isHomographOf(domain){ if(!domain) return null; for(const brand of PROTECTED_BRANDS){ const name=brand.split(".")[0]; if(domain!==brand && domain.includes(name)) return brand; } return null; }

  function scoreIdentity(parsed){
    const spf=parsed.auth.spf, dkim=parsed.auth.dkim, dmarc=parsed.auth.dmarc;
    let authPoints=0; const evidence=[];
    if(spf==="PASS"){authPoints+=5;evidence.push("SPF: PASS");} else evidence.push("SPF: "+spf);
    if(dkim==="PASS"){authPoints+=5;evidence.push("DKIM: PASS");} else evidence.push("DKIM: "+dkim);
    if(dmarc==="PASS"){authPoints+=5;evidence.push("DMARC policy: PASS");} else evidence.push("DMARC policy: "+dmarc);
    const lookalike=isHomographOf(parsed.fromDomain);
    const known=KNOWN_GOOD_DOMAINS.has(parsed.fromDomain);
    let domainRepPoints;
    if(lookalike){domainRepPoints=0;evidence.push('Sending domain "'+parsed.fromDomain+'" resembles a protected brand ("'+lookalike+'") - likely lookalike/homograph');}
    else if(known){domainRepPoints=10;evidence.push('Sending domain "'+parsed.fromDomain+'" has an established reputation with this institution');}
    else {domainRepPoints=2;evidence.push('Sending domain "'+parsed.fromDomain+'" has no established history with this institution - first time seen');}
    if(parsed.replyToDomain && parsed.fromDomain && parsed.replyToDomain!==parsed.fromDomain){ evidence.push("Reply-To domain ("+parsed.replyToDomain+") does not match From domain ("+parsed.fromDomain+")"); domainRepPoints=Math.max(0,domainRepPoints-2); }
    let points=Math.min(25,authPoints+domainRepPoints);
    if(lookalike) points=Math.min(points,5);
    const allPass=spf==="PASS"&&dkim==="PASS"&&dmarc==="PASS";
    let technicalLabel = lookalike?"LOW":(allPass?"HIGH":(authPoints>=5?"MEDIUM":"LOW"));
    return {points,technicalLabel,evidence,domainKnown:known,lookalike};
  }

  function countMatches(text,words){ const l=text.toLowerCase(); return words.filter(w=>l.includes(w)); }

  function scoreContent(parsed){
    const text=(parsed.subject+"\n"+parsed.body);
    const urgencyHits=countMatches(text,URGENCY_WORDS), credHits=countMatches(text,CREDENTIAL_WORDS), paymentHits=countMatches(text,PAYMENT_WORDS);

function runScanAnimation(){
  const counterEl = document.getElementById("scanCounter");
  const stageItems = document.querySelectorAll("#stageList li");
  const total = INBOX.length;
  let shown = 0;
  const stageDelay = 420;
  stageItems.forEach((li,idx)=>{
    setTimeout(()=>{ li.classList.add("done"); li.querySelector(".mark").textContent="OK"; }, idx*stageDelay);
  });
  const duration = stageItems.length*stageDelay + 400;
  const start = performance.now();
  function tick(now){
    const p = Math.min(1,(now-start)/duration);
    shown = Math.round(p*total);
    if(counterEl) counterEl.textContent = shown;
    if(p<1) requestAnimationFrame(tick);
    else {
      if(counterEl) counterEl.textContent = total;
      APP.scanned = true;
      APP.lastScanTime = new Date().toLocaleString();
      const w = document.getElementById("scanDoneWrap");
      if(w) w.style.display = "block";
    }
  }
  requestAnimationFrame(tick);
}

  return '<div class="tab-row">'+tabBtns+'</div>'+authPanel+contentPanel+behPanel+infPanel+headersPanel;
}

/* ============ SCREEN: CORRELATION GRAPH ============ */
function screenGraph(campaignId){
  const facts = campaignFacts();
  const students = [...new Set(CAMPAIGN_MESSAGES.map(m=>m.student))];
  const domains = facts.relatedDomains;
  const n = students.length, d = domains.length;
  const cx=340, cy=140, rStud=85, rDom=180;
  const studPos = students.map((s,i)=>({key:s,name:STUDENTS[s].name,dept:STUDENTS[s].dept,
    x:cx+rStud*Math.cos((i/n)*2*Math.PI-Math.PI/2), y:cy+rStud*Math.sin((i/n)*2*Math.PI-Math.PI/2)*0.62}));
  const domPos = domains.map((dm,i)=>({key:dm,
    x:cx+rDom*Math.cos((i/d)*2*Math.PI-Math.PI/2+0.3), y:cy+rDom*Math.sin((i/d)*2*Math.PI-Math.PI/2+0.3)*0.5-6}));
  const infraX = cx, infraY = cy+2;

  const ns = "http://www.w3.org/2000/svg";
  let svg = '<svg id="corrGraph" viewBox="0 0 680 300" xmlns="'+ns+'"><g transform="translate(0,14)">';
  // edges: student -> domain (based on which domains that student's messages used)
  CAMPAIGN_MESSAGES.forEach(m=>{
    const sp = studPos.find(s=>s.key===m.student);
    const dom = m.domain || HaloEngine.parseEmailSource(m.raw).fromDomain;
    const dp = domPos.find(x=>x.key===dom);
    if(sp && dp) svg += '<line x1="'+sp.x+'" y1="'+sp.y+'" x2="'+dp.x+'" y2="'+dp.y+'" stroke="#2a4a5a" stroke-width="1.5" opacity="0.8"/>';
  });
  // domain -> shared infra node
  domPos.forEach(dp=>{ svg += '<line x1="'+dp.x+'" y1="'+dp.y+'" x2="'+infraX+'" y2="'+infraY+'" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>'; });
  // infra node (center)
  svg += '<circle cx="'+infraX+'" cy="'+infraY+'" r="9" fill="var(--accent)"/><text x="'+infraX+'" y="'+(infraY-14)+'" fill="var(--accent)" font-size="11" text-anchor="middle" font-family="VT323">shared infra</text>';
  // domain nodes
  domPos.forEach(dp=>{
    svg += '<circle cx="'+dp.x+'" cy="'+dp.y+'" r="7" fill="var(--cyan)"/>';
    svg += '<text x="'+dp.x+'" y="'+(dp.y-12)+'" fill="var(--cyan)" font-size="11" text-anchor="middle" font-family="VT323">'+esc(dp.key)+'</text>';
  });
  // student nodes
  studPos.forEach(sp=>{
    svg += '<circle cx="'+sp.x+'" cy="'+sp.y+'" r="10" fill="#f5f3ee" stroke="var(--rule)" stroke-width="2"/>';
    svg += '<text x="'+sp.x+'" y="'+(sp.y+4)+'" fill="var(--bg-void)" font-size="10" text-anchor="middle" font-family="VT323">'+esc(sp.name.split(" ")[0])+'</text>';
    svg += '<text x="'+sp.x+'" y="'+(sp.y+22)+'" fill="var(--rule)" font-size="10" text-anchor="middle" font-family="VT323">'+esc(sp.dept)+'</text>';
  });
  svg += '</g></svg>';

  return '<button class="pixel-btn secondary" data-action="back-email" style="margin-bottom:14px;">&lt; BACK TO MESSAGE</button>'+
    '<div class="panel">'+
      '<div class="panel-title">COORDINATED CAMPAIGN DETECTED</div>'+
      '<div class="metric-grid" style="margin-bottom:14px;">'+
        '<div class="metric-card"><div class="m-label">STUDENTS AFFECTED</div><div class="m-value flag-bad">'+facts.studentsAffected+'</div></div>'+
        '<div class="metric-card"><div class="m-label">DEPARTMENTS</div><div class="m-value">'+facts.departments.join(", ")+'</div></div>'+
        '<div class="metric-card"><div class="m-label">RELATED MESSAGES</div><div class="m-value flag-bad">'+facts.relatedMessages+'</div></div>'+
        '<div class="metric-card"><div class="m-label">RELATED DOMAINS</div><div class="m-value flag-bad">'+facts.relatedDomains.length+'</div></div>'+
      '</div>'+
      '<div class="graph-shell">'+svg+'</div>'+
      '<div class="graph-legend">'+
        '<span><span class="legend-dot" style="background:#f5f3ee;border:1px solid var(--rule);"></span>Student</span>'+
        '<span><span class="legend-dot" style="background:var(--cyan);"></span>Sending domain</span>'+
        '<span><span class="legend-dot" style="background:var(--accent);"></span>Shared infrastructure</span>'+
      '</div>'+
      '<p style="font-size:15px;color:var(--ink-soft);margin-top:12px;">All three domains route through the same observed hosting infrastructure, despite using different sender names. This is what lets HALO connect reports that look unrelated on their own.</p>'+
    '</div>';
}

/* ============ INSTITUTION: CAMPAIGN DETAIL ============ */
function screenCampaignDetail(id){

  const tabs = [["overview","Overview"],["evidence","Evidence"],["timeline","Timeline"],["students","Students"]];
  const tabBtns = tabs.map(([k,l])=>'<button class="tab-btn '+(APP.activeTab===k?"active":"")+'" data-action="campaign-tab" data-tab="'+k+'">'+l+'</button>').join("");

  const evidence = c.evidence || ["All messages request credentials and/or payment.","All messages create artificial urgency.","Messages route through shared hosting infrastructure across multiple sender domains."];
  const timeline = c.timeline || ["10 Sep, 19:02 - first report (Priya Nair, CSE)","10 Sep, 21:14 - second report (Aarav Sharma, CSE)","10 Sep, 22:10-23:00 - three more reports (ECE, MBA)","11 Sep, 07:55-08:40 - reminder wave sent to all five students"];
  const recommendedAction = c.recommendedAction || "Notify affected students, publish a campus-wide advisory, and block the related domains at the mail gateway.";

  const studentsInCampaign = id==="fake-internship" ? [...new Set(CAMPAIGN_MESSAGES.map(m=>m.student))].map(k=>STUDENTS[k].name+" ("+STUDENTS[k].dept+")") : ["(synthetic summary data for this campaign)"];

  const overviewPanel = '<div class="tab-content '+(APP.activeTab==="overview"?"active":"")+'" data-tabpanel="overview">'+
    '<div class="metric-grid">'+
      '<div class="metric-card"><div class="m-label">STUDENTS AFFECTED</div><div class="m-value flag-bad">'+c.studentsAffected+'</div></div>'+
      '<div class="metric-card"><div class="m-label">DEPARTMENTS</div><div class="m-value">'+c.departments.join(", ")+'</div></div>'+
      '<div class="metric-card"><div class="m-label">RELATED MESSAGES</div><div class="m-value">'+c.relatedMessages+'</div></div>'+
      '<div class="metric-card"><div class="m-label">RELATED DOMAINS</div><div class="m-value">'+c.relatedDomains.join(", ")+'</div></div>'+
    '</div>'+
    '<p style="font-size:16px;margin-top:12px;"><strong>Recommended action:</strong> '+esc(recommendedAction)+'</p>'+
  '</div>';
  const evidencePanel = '<div class="tab-content '+(APP.activeTab==="evidence"?"active":"")+'" data-tabpanel="evidence"><ul class="why-list">'+evidence.map(x=>'<li>- '+esc(x)+'</li>').join("")+'</ul></div>';
  const timelinePanel = '<div class="tab-content '+(APP.activeTab==="timeline"?"active":"")+'" data-tabpanel="timeline"><ul class="timeline">'+timeline.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>';
  const studentsPanel = '<div class="tab-content '+(APP.activeTab==="students"?"active":"")+'" data-tabpanel="students"><ul class="why-list">'+studentsInCampaign.map(x=>'<li>- '+esc(x)+'</li>').join("")+'</ul></div>';

    '<div class="panel">'+
      '<div class="panel-title">'+esc(c.name).toUpperCase()+'</div>'+
      '<div class="tab-row">'+tabBtns+'</div>'+overviewPanel+evidencePanel+timelinePanel+studentsPanel+
      '<div class="action-row" style="margin-top:16px;border-top:2px solid var(--ink);padding-top:14px;">'+
        '<button class="pixel-btn" data-action="notify-students" data-id="'+id+'" '+(notified?"disabled":"")+'>'+(notified?"NOTIFIED &#10003;":"NOTIFY AFFECTED STUDENTS")+'</button>'+
        '<button class="pixel-btn secondary" data-action="export-report" data-id="'+id+'">EXPORT INCIDENT REPORT</button>'+
        (id==="fake-internship" ? '<button class="pixel-btn ghost" data-action="view-related" data-campaign="fake-internship">INVESTIGATE (VIEW GRAPH)</button>' : '')+
      '</div>'+

}

/* ============ REPORTS ============ */

function campaignDetailData(c){

  const timeline = c.timeline || ["10 Sep, 19:02 - first report (Priya Nair, CSE)","10 Sep, 21:14 - second report (Aarav Sharma, CSE)","10 Sep, 22:10-23:00 - three more reports (ECE, MBA)","11 Sep, 07:55-08:40 - reminder wave sent to all five students"];

/* ============ RENDER DISPATCH ============ */
function render(){
  renderNav();
  const root = document.getElementById("screenRoot");
  let html;
  switch(APP.screen){
    case "landing": html = screenLanding(); break;
    case "scanning": html = screenScanning(); break;
    case "scan-complete": html = screenScanComplete(); break;
    case "inbox": html = screenInbox(); break;
    case "email-detail": html = screenEmailDetail(); break;
    case "graph": html = screenGraph(APP.currentCampaignId); break;
    case "inst-overview": html = screenInstOverview(); break;
    case "inst-campaigns": html = screenInstCampaigns(); break;
    case "inst-students": html = screenInstStudents(); break;
    case "inst-investigations": html = screenInstInvestigations(); break;
    case "campaign-detail": html = screenCampaignDetail(APP.currentCampaignId); break;
    case "reports": html = screenReports(); break;
    default: html = screenLanding();
  }
  root.innerHTML = html;
  if(APP.screen==="scanning") runScanAnimation();
  if(APP.screen==="email-detail"){
    const det = document.getElementById("techDetails");
    if(det) det.addEventListener("toggle", ()=>{ APP.techOpen = det.open; });
  }
}

/* ============ EVENT WIRING ============ */
function exportIncidentReport(id){
  const c = allCampaigns().find(x=>x.id===id);
  if(!c) return;
  const d = campaignDetailData(c);
  const report = "=======================================================\n"+
"HALO - INCIDENT REPORT\n"+
"Generated: "+new Date().toLocaleString()+"\n"+
"=======================================================\n\n"+
"CAMPAIGN: "+c.name+"\n"+
"STUDENTS AFFECTED: "+c.studentsAffected+"\n"+
"DEPARTMENTS: "+c.departments.join(", ")+"\n"+
"RELATED MESSAGES: "+c.relatedMessages+"\n"+
"RELATED DOMAINS: "+c.relatedDomains.join(", ")+"\n\n"+
"--- EVIDENCE ---\n"+d.evidence.map(x=>"- "+x).join("\n")+"\n\n"+
"--- TIMELINE ---\n"+d.timeline.map(x=>"- "+x).join("\n")+"\n\n"+
"--- RECOMMENDED ACTION ---\n"+d.recommendedAction+"\n\n"+
"=======================================================\n"+
"END OF REPORT - HALO PROTOTYPE, SYNTHETIC DEMO DATA\n"+
"=======================================================";
  const blob = new Blob([report], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "halo_incident_"+id+".txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Incident report exported.");
}

document.addEventListener("click", (ev)=>{
  const el = ev.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;
  if(action==="connect"){
    APP.provider = el.dataset.provider;
    showToast("Connected via "+APP.provider+" - your inbox is connected.");
    setTimeout(()=>{ APP.screen="scanning"; render(); }, 900);
  } else if(action==="view-results"){ APP.screen="scan-complete"; render(); }
  else if(action==="open-inbox"){ APP.inboxFilter = el.dataset.filter; APP.screen="inbox"; render(); }
  else if(action==="filter-inbox"){ APP.inboxFilter = el.dataset.filter; render(); }
  else if(action==="open-email"){ APP.currentEmailId = el.dataset.id; APP.activeTab="auth"; APP.techOpen=false; APP.screen="email-detail"; render(); }
  else if(action==="back-inbox"){ APP.screen="inbox"; render(); }
  else if(action==="evidence-tab"){ APP.activeTab = el.dataset.tab; APP.techOpen=true; render(); }
  else if(action==="verify-opportunity"){ showToast("Always verify opportunities directly with the organisation through an official channel."); }
  else if(action==="report-tp"){ showToast("Reported to T&P Cell. Thank you for flagging this."); }
  else if(action==="mark-safe"){ showToast("Marked as reviewed."); }
  else if(action==="view-related"){ APP.currentCampaignId = el.dataset.campaign; APP.screen="graph"; render(); }
  else if(action==="back-email"){ APP.screen="email-detail"; render(); }
  else if(action==="subnav-student"){
    const key = el.dataset.key;
    if(key==="inbox"){ APP.inboxFilter="all"; APP.screen="inbox"; }
    else if(key==="attention"){ APP.inboxFilter="attention"; APP.screen="inbox"; }
    else if(key==="scan"){ APP.screen="scanning"; }
    else if(key==="reports"){ APP.screen="reports"; }
    render();
  } else if(action==="subnav-inst"){
    const key = el.dataset.key;
    if(key==="overview") APP.screen="inst-overview";
    else if(key==="campaigns") APP.screen="inst-campaigns";
    else if(key==="students") APP.screen="inst-students";
    else if(key==="investigations") APP.screen="inst-investigations";
    render();
  } else if(action==="open-campaign"){ APP.currentCampaignId = el.dataset.id; APP.activeTab="overview"; APP.screen="campaign-detail"; render(); }
  else if(action==="campaign-tab"){ APP.activeTab = el.dataset.tab; render(); }
  else if(action==="notify-students"){
    const id = el.dataset.id; APP.notified.add(id);
    const c = allCampaigns().find(x=>x.id===id);
    showToast("Notification sent to "+(c?c.studentsAffected:"")+" students.");
    render();
  } else if(action==="export-report"){ exportIncidentReport(el.dataset.id); }
});

document.getElementById("navSwitch").addEventListener("click",(ev)=>{
  const btn = ev.target.closest(".mode-btn"); if(!btn) return;
  APP.nav = btn.dataset.nav;
  APP.screen = APP.nav==="student" ? (APP.scanned?"inbox":"landing") : "inst-overview";
  render();
});

document.getElementById("resetBtn").addEventListener("click", ()=>{
  APP.screen="landing"; APP.nav="student"; APP.provider=null; APP.scanned=false; APP.inboxFilter="all";
  APP.currentEmailId=null; APP.currentCampaignId=null; APP.notified=new Set(); APP.activeTab="auth"; APP.lastScanTime=null;
  render();
  showToast("Demo reset.");
});

render();
</script>
